<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olivec Container Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
  <style>
    body { background: #f3f4f6; margin: 0; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    @media print {
      body { background: white; }
      input, select, button { border: 1px solid #ccc !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useMemo } = React;

    const PRESETS = {
      canada: {
        label: "Canada 4020",
        oceanFreight: 4400,
        drayage: 1500,
        customs: 500,
        admin: 1000,
        tariffRate: 25,
        containerCapacity: 650,
        panels: [
          { name: "6H", fobCost: 50, quantity: 650, margin: 17.68 },
          { name: "4H", fobCost: 46, quantity: 0, margin: 17.68 },
          { name: "8H", fobCost: 45, quantity: 0, margin: 17.68 },
          { name: "Other", fobCost: 68, quantity: 0, margin: 17.68 },
        ],
        shippingCosts: {
          Vancouver: 4500, "Prince Rupert": 4500, Calgary: 6000,
          Edmonton: 6000, Winnipeg: 0, Toronto: 8000,
        },
      },
      usa: {
        label: "USA 4020",
        oceanFreight: 6200,
        drayage: 2300,
        customs: 500,
        admin: 1000,
        tariffRate: 25,
        containerCapacity: 650,
        panels: [
          { name: "6H", fobCost: 50, quantity: 650, margin: 17.68 },
          { name: "6H PVC", fobCost: 46, quantity: 0, margin: 17.68 },
          { name: "4H", fobCost: 45, quantity: 0, margin: 17.68 },
          { name: "8H", fobCost: 68, quantity: 0, margin: 17.68 },
        ],
        shippingCosts: {
          Vancouver: 4500, "Prince Rupert": 4500, Calgary: 6000,
          Edmonton: 6000, Winnipeg: 0, Toronto: 8000,
        },
      },
      custom: {
        label: "Custom Container",
        oceanFreight: 7200,
        drayage: 1500,
        customs: 500,
        admin: 1000,
        tariffRate: 25,
        containerCapacity: 600,
        panels: [
          { name: "Custom 1", fobCost: 66.3, quantity: 600, margin: 17.68 },
          { name: "Custom 2", fobCost: 50, quantity: 0, margin: 17.68 },
          { name: "Custom 3", fobCost: 45, quantity: 0, margin: 17.68 },
          { name: "Custom 4", fobCost: 68, quantity: 0, margin: 17.68 },
        ],
        shippingCosts: {
          Vancouver: 4500, "Prince Rupert": 4500, Calgary: 6000,
          Edmonton: 6000, Winnipeg: 0, Toronto: 8000,
        },
      },
    };

    function fmt(n) {
      if (n === null || n === undefined || isNaN(n)) return "$0.00";
      return "$" + Number(n).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function pct(n) {
      if (n === null || n === undefined || isNaN(n)) return "0.00%";
      return Number(n).toFixed(2) + "%";
    }

    function NumberInput({ label, value, onChange, prefix = "", suffix = "", min = 0, step = "any" }) {
      return (
        <div className="flex flex-col gap-1">
          {label && <label className="text-xs font-medium text-gray-500 uppercase tracking-wide">{label}</label>}
          <div className="flex items-center border border-gray-300 rounded-md bg-white overflow-hidden focus-within:ring-2 focus-within:ring-green-500 focus-within:border-green-500">
            {prefix && <span className="pl-2 text-gray-400 text-sm">{prefix}</span>}
            <input
              type="number"
              value={value}
              onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
              min={min}
              step={step}
              className="w-full py-1.5 px-2 text-sm text-right outline-none bg-transparent"
            />
            {suffix && <span className="pr-2 text-gray-400 text-sm">{suffix}</span>}
          </div>
        </div>
      );
    }

    function TextInput({ value, onChange }) {
      return (
        <input
          type="text"
          value={value}
          onChange={(e) => onChange(e.target.value)}
          className="w-full py-1.5 px-2 text-sm border border-gray-300 rounded-md bg-white outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
        />
      );
    }

    function OlivecContainerCalculator() {
      const [mode, setMode] = useState("canada");
      const [oceanFreight, setOceanFreight] = useState(PRESETS.canada.oceanFreight);
      const [drayage, setDrayage] = useState(PRESETS.canada.drayage);
      const [customs, setCustoms] = useState(PRESETS.canada.customs);
      const [admin, setAdmin] = useState(PRESETS.canada.admin);
      const [tariffRate, setTariffRate] = useState(PRESETS.canada.tariffRate);
      const [containerCapacity, setContainerCapacity] = useState(PRESETS.canada.containerCapacity);
      const [destination, setDestination] = useState("Calgary");

      const handleDestinationChange = useCallback((city) => {
        setDestination(city);
        setOceanFreight(shippingCosts[city] || 0);
      }, [shippingCosts]);
      const [panels, setPanels] = useState(PRESETS.canada.panels.map((p) => ({ ...p })));
      const [shippingCosts, setShippingCosts] = useState({ ...PRESETS.canada.shippingCosts });
      const [cadUsd, setCadUsd] = useState(0.72);

      const loadPreset = useCallback((key) => {
        const p = PRESETS[key];
        setMode(key);
        setOceanFreight(p.oceanFreight);
        setDrayage(p.drayage);
        setCustoms(p.customs);
        setAdmin(p.admin);
        setTariffRate(p.tariffRate);
        setContainerCapacity(p.containerCapacity);
        setPanels(p.panels.map((x) => ({ ...x })));
        setShippingCosts({ ...p.shippingCosts });
      }, []);

      const updatePanel = useCallback((idx, field, val) => {
        setPanels((prev) => prev.map((p, i) => (i === idx ? { ...p, [field]: val } : p)));
      }, []);

      const calculations = useMemo(() => {
        const variableCosts = oceanFreight + drayage + customs + admin;
        const spacePerPanel = containerCapacity > 0 ? 1 / containerCapacity : 0;

        const rows = panels.map((p) => {
          const costPerPanel = variableCosts * spacePerPanel + p.fobCost;
          const marginDollar = costPerPanel * (p.margin / 100);
          const pricePerPanel = costPerPanel * (1 + p.margin / 100);
          const tariffPerPanel = p.fobCost * (tariffRate / 100);
          const withTariff = pricePerPanel + tariffPerPanel;
          const subtotal = withTariff * p.quantity;
          const spaceUsed = p.quantity * spacePerPanel * 100;
          const profit = marginDollar * p.quantity;
          const usdPrice = withTariff * cadUsd;

          const priceTotalActual = (variableCosts + p.fobCost * p.quantity) * (1 + p.margin / 100);
          const actualPerPanel = p.quantity > 0 ? priceTotalActual / p.quantity : 0;
          const inefficiency = actualPerPanel - pricePerPanel;

          return {
            ...p, costPerPanel, marginDollar, pricePerPanel, tariffPerPanel,
            withTariff, subtotal, spaceUsed, profit, usdPrice,
            priceTotalActual, actualPerPanel, inefficiency,
          };
        });

        const totalQuantity = rows.reduce((s, r) => s + r.quantity, 0);
        const totalSubtotal = rows.reduce((s, r) => s + r.subtotal, 0);
        const totalProfit = rows.reduce((s, r) => s + r.profit, 0);
        const totalCapacityUsed = rows.reduce((s, r) => s + r.spaceUsed, 0);

        return { variableCosts, spacePerPanel, rows, totalQuantity, totalSubtotal, totalProfit, totalCapacityUsed };
      }, [panels, oceanFreight, drayage, customs, admin, tariffRate, containerCapacity, cadUsd]);

      const cities = Object.keys(shippingCosts);

      return (
        <div className="max-w-6xl mx-auto p-4 font-sans">
          {/* Header */}
          <div style={{background: "linear-gradient(to right, #166534, #16a34a)"}} className="text-white rounded-xl p-6 mb-6 shadow-lg">
            <div className="flex items-center justify-between flex-wrap gap-4">
              <div>
                <h1 className="text-2xl font-bold tracking-tight">Olivec Container Calculator</h1>
                <p className="text-green-100 text-sm mt-1">Full Container Pricing Tool</p>
              </div>
              <div className="flex gap-2">
                {Object.entries(PRESETS).map(([key, val]) => (
                  <button
                    key={key}
                    onClick={() => loadPreset(key)}
                    className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${
                      mode === key
                        ? "bg-white text-green-800 shadow-md"
                        : "bg-green-700 text-green-100 hover:bg-green-600"
                    }`}
                  >
                    {val.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Container Capacity + Destination */}
          <div className="flex flex-wrap gap-4 mb-6">
            <div className="bg-white rounded-xl border border-gray-200 p-4 shadow-sm flex-1" style={{minWidth: "16rem"}}>
              <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Container</h3>
              <NumberInput label="Unit Capacity" value={containerCapacity} onChange={setContainerCapacity} suffix="panels" />
            </div>
            <div className="bg-white rounded-xl border border-gray-200 p-4 shadow-sm flex-1" style={{minWidth: "16rem"}}>
              <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Destination</h3>
              <select
                value={destination}
                onChange={(e) => handleDestinationChange(e.target.value)}
                className="w-full py-2 px-3 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-green-500 outline-none"
              >
                {cities.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
              <div className="mt-2 text-sm text-gray-500">
                Shipping: <span className="font-semibold text-gray-800">{fmt(shippingCosts[destination])}</span>
              </div>
              {mode === "usa" && (
                <div className="mt-2">
                  <NumberInput label="CAD/USD Rate" value={cadUsd} onChange={setCadUsd} step="0.01" />
                </div>
              )}
            </div>
          </div>

          {/* Variable Costs */}
          <div className="bg-white rounded-xl border border-gray-200 p-4 shadow-sm mb-6">
            <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Variable Costs (per container)</h3>
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-4">
              <NumberInput label="Ocean Freight" value={oceanFreight} onChange={setOceanFreight} prefix="$" />
              <NumberInput label="Drayage" value={drayage} onChange={setDrayage} prefix="$" />
              <NumberInput label="Customs" value={customs} onChange={setCustoms} prefix="$" />
              <NumberInput label="Admin" value={admin} onChange={setAdmin} prefix="$" />
              <NumberInput label="Tariff Rate" value={tariffRate} onChange={setTariffRate} suffix="%" />
            </div>
            <div className="mt-3 flex items-center gap-2 text-sm">
              <span className="text-gray-500">Total Variable:</span>
              <span className="font-bold text-green-700">{fmt(calculations.variableCosts)}</span>
              <span className="text-gray-400 mx-1">|</span>
              <span className="text-gray-500">Per Panel:</span>
              <span className="font-bold text-green-700">{fmt(calculations.variableCosts / containerCapacity)}</span>
            </div>
          </div>

          {/* Panel Configuration */}
          <div className="bg-white rounded-xl border border-gray-200 shadow-sm mb-6 overflow-hidden">
            <div className="p-4 border-b border-gray-100">
              <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider">
                Panel Configuration — {containerCapacity} panel capacity
              </h3>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-gray-50">
                    <th className="text-left py-2 px-3 font-semibold text-gray-600 text-xs uppercase">Panel</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">Qty</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">FOB Cost</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">Margin %</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">Cost/Panel</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">Margin $</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">Price/Panel</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">Tariff</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">With Tariff</th>
                    {mode === "usa" && (
                      <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">USD</th>
                    )}
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">Sub-total</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">Space %</th>
                    <th className="text-right py-2 px-3 font-semibold text-yellow-700 text-xs uppercase" style={{background: "#fffbeb"}}>$/Panel Actual</th>
                    <th className="text-right py-2 px-3 font-semibold text-yellow-700 text-xs uppercase" style={{background: "#fffbeb"}}>Total (less tariff)</th>
                    <th className="text-right py-2 px-3 font-semibold text-gray-600 text-xs uppercase">Profit</th>
                  </tr>
                </thead>
                <tbody>
                  {calculations.rows.map((row, idx) => (
                    <tr key={idx} className={`border-t border-gray-100 ${row.quantity > 0 ? "bg-white" : "bg-gray-50 opacity-60"}`}>
                      <td className="py-2 px-3"><TextInput value={row.name} onChange={(v) => updatePanel(idx, "name", v)} /></td>
                      <td className="py-2 px-3">
                        <input type="number" value={panels[idx].quantity}
                          onChange={(e) => updatePanel(idx, "quantity", parseFloat(e.target.value) || 0)}
                          className="w-20 py-1 px-2 text-sm text-right border border-gray-300 rounded bg-white outline-none focus:ring-2 focus:ring-green-500" />
                      </td>
                      <td className="py-2 px-3">
                        <div className="flex items-center border border-gray-300 rounded bg-white overflow-hidden focus-within:ring-2 focus-within:ring-green-500">
                          <span className="pl-2 text-gray-400 text-xs">$</span>
                          <input type="number" value={panels[idx].fobCost}
                            onChange={(e) => updatePanel(idx, "fobCost", parseFloat(e.target.value) || 0)}
                            step="0.01" className="w-16 py-1 px-1 text-sm text-right outline-none bg-transparent" />
                        </div>
                      </td>
                      <td className="py-2 px-3">
                        <div className="flex items-center border border-gray-300 rounded bg-white overflow-hidden focus-within:ring-2 focus-within:ring-green-500">
                          <input type="number" value={panels[idx].margin}
                            onChange={(e) => updatePanel(idx, "margin", parseFloat(e.target.value) || 0)}
                            step="0.01" className="w-14 py-1 px-1 text-sm text-right outline-none bg-transparent" />
                          <span className="pr-1 text-gray-400 text-xs">%</span>
                        </div>
                      </td>
                      <td className="py-2 px-3 text-right font-mono text-gray-700">{fmt(row.costPerPanel)}</td>
                      <td className="py-2 px-3 text-right font-mono text-gray-700">{fmt(row.marginDollar)}</td>
                      <td className="py-2 px-3 text-right font-mono text-gray-700">{fmt(row.pricePerPanel)}</td>
                      <td className="py-2 px-3 text-right font-mono text-gray-700">{fmt(row.tariffPerPanel)}</td>
                      <td className="py-2 px-3 text-right font-mono font-semibold text-gray-900">{fmt(row.withTariff)}</td>
                      {mode === "usa" && (
                        <td className="py-2 px-3 text-right font-mono text-blue-700">{fmt(row.usdPrice)}</td>
                      )}
                      <td className="py-2 px-3 text-right font-mono font-semibold text-gray-900">{fmt(row.subtotal)}</td>
                      <td className="py-2 px-3 text-right font-mono text-gray-700">{pct(row.spaceUsed)}</td>
                      <td className={`py-2 px-3 text-right font-mono font-semibold ${row.inefficiency > 0.01 ? "text-yellow-700" : "text-gray-700"}`} style={{background: "#fffbeb"}}>
                        {fmt(row.actualPerPanel)}
                        {row.inefficiency > 0.01 && row.quantity > 0 && (
                          <div className="text-xs text-yellow-500 font-normal">+{fmt(row.inefficiency)}</div>
                        )}
                      </td>
                      <td className="py-2 px-3 text-right font-mono font-semibold text-yellow-700" style={{background: "#fffbeb"}}>{fmt(row.priceTotalActual)}</td>
                      <td className="py-2 px-3 text-right font-mono text-green-700 font-semibold">{fmt(row.profit)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Summary */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
            <div className="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
              <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Cost</div>
              <div className="text-2xl font-bold text-gray-900 mt-1">{fmt(calculations.totalSubtotal)}</div>
              <div className="text-xs text-gray-400 mt-1">{calculations.totalQuantity} panels</div>
            </div>
            <div className="rounded-xl border p-4 shadow-sm" style={{background: "#f0fdf4", borderColor: "#bbf7d0"}}>
              <div className="text-xs font-semibold text-green-600 uppercase tracking-wider">Total Profit</div>
              <div className="text-2xl font-bold text-green-700 mt-1">{fmt(calculations.totalProfit)}</div>
              <div className="text-xs text-green-500 mt-1">
                {calculations.totalSubtotal > 0
                  ? pct((calculations.totalProfit / calculations.totalSubtotal) * 100) + " margin"
                  : "\u2014"}
              </div>
            </div>
            <div className={`rounded-xl border p-4 shadow-sm ${
              calculations.totalCapacityUsed > 100
                ? "bg-red-50 border-red-200"
                : calculations.totalCapacityUsed > 90
                ? "bg-yellow-50 border-yellow-200"
                : "bg-white border-gray-200"
            }`}>
              <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Container Capacity</div>
              <div className={`text-2xl font-bold mt-1 ${calculations.totalCapacityUsed > 100 ? "text-red-600" : "text-gray-900"}`}>
                {pct(calculations.totalCapacityUsed)}
              </div>
              <div className="w-full bg-gray-200 rounded-full h-2 mt-2">
                <div
                  className={`h-2 rounded-full transition-all ${
                    calculations.totalCapacityUsed > 100
                      ? "bg-red-500"
                      : calculations.totalCapacityUsed > 90
                      ? "bg-yellow-500"
                      : "bg-green-500"
                  }`}
                  style={{ width: `${Math.min(calculations.totalCapacityUsed, 100)}%` }}
                />
              </div>
            </div>
            <div className="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
              <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Price/Panel (Avg)</div>
              <div className="text-2xl font-bold text-gray-900 mt-1">
                {calculations.totalQuantity > 0 ? fmt(calculations.totalSubtotal / calculations.totalQuantity) : "$0.00"}
              </div>
              <div className="text-xs text-gray-400 mt-1">with tariff</div>
            </div>
          </div>

          {/* Shipping Cost Reference */}
          <div className="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
            <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Shipping Cost Reference (editable)</h3>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
              {cities.map((city) => (
                <div key={city}>
                  <label className="text-xs text-gray-500">{city}</label>
                  <div className="flex items-center border border-gray-300 rounded bg-white overflow-hidden focus-within:ring-2 focus-within:ring-green-500">
                    <span className="pl-2 text-gray-400 text-xs">$</span>
                    <input type="number" value={shippingCosts[city]}
                      onChange={(e) => setShippingCosts((prev) => ({ ...prev, [city]: parseFloat(e.target.value) || 0 }))}
                      className="w-full py-1.5 px-1 text-sm text-right outline-none bg-transparent" />
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Footer */}
          <div className="text-center text-xs text-gray-400 mt-6 pb-4">
            Olivec Canada — Container Calculator Template
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<OlivecContainerCalculator />);
  </script>
</body>
</html>
